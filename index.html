<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deutsch Lernen" />
    <meta
      name="description"
      content="Deutsch lernen von A1 bis B2 – zweisprachig Deutsch/Arabisch. تعلم الألمانية من المستوى A1 إلى B2 بشرح ثنائي اللغة."
    />
    <title>Deutsch Lernen — تعلّم الألمانية</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('learn-german:theme');
          var preference = raw ? JSON.parse(raw).state.preference : 'system';
          var isDark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          // If anything goes wrong, fall back to the default light theme silently.
        }
        // Text size and contrast are applied before first paint too, so the page never jumps from 100% to the chosen size.
        try {
          var prefs = JSON.parse(localStorage.getItem('learn-german:preferences')).state.settings;
          var percent = { large: 112.5, xlarge: 125 }[prefs.textScale];
          if (percent) document.documentElement.style.fontSize = percent + '%';
          if (prefs.highContrast) document.documentElement.classList.add('high-contrast');
        } catch (e) {
          // No saved preferences yet — defaults apply.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
